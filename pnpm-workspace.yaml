allowBuilds:
  esbuild: true
  msgpackr-extract: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  # Dev tooling (react-scan) pulls in the OpenTelemetry API; a second copy
  # splits vitest into two instances, and @effect/vitest then loses the
  # current suite.
  "@opentelemetry/api": 1.9.1
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
