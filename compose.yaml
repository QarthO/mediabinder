name: mediabinder
services:
  web:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3100
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mediabinder
      MYSQL_USER: mediabinder
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u mediabinder -e "SELECT 1" mediabinder',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
